[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bus-rl"
version = "0.1.0"
description = "Dynamic bus fleet-control simulator"
requires-python = ">=3.11,<3.12"
dependencies = [
  "gymnasium>=1.0",
  "matplotlib>=3.9",
  "networkx>=3.3",
  "numpy>=2.0",
  "pandas>=2.2",
  "stable-baselines3>=2.4",
  "sb3-contrib>=2.4",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
bus-rl = "bus_rl.cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/bus_rl"]
