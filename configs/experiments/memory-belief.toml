# Follow-up: longer causal memory and three demand-belief configurations.
[control]
enable_reassign = true
enable_short_turn = true

[algorithm]
encoder = "gru"
history_minutes = 10
gamma = 1.0
seed = 11
learning_rate = 3.0e-4
n_steps = 256
n_envs = 4
batch_size = 256
n_epochs = 4
ent_coef = 0.01
vf_coef = 0.5
max_grad_norm = 0.5
gae_lambda = 0.95
clip_range = 0.2
total_timesteps = 98304
eval_freq = 12288
device = "cpu"
torch_threads = 2
diagnostics_enabled = true
diagnostics_interval = 256

[runtime]
backend = "rust"
eval_batch_size = 16
reuse_eval_pool = true
native_batch = true
validate_distributions = false
validate_observation = true

[forecast]
enabled = false

[study]
name = "memory-belief-followup"
probe_seed_start = 71001
comparisons = [
  ["gru20", "gru10"], ["gru30", "gru10"],
  ["belief20", "gru10"], ["belief20_weak", "gru10"],
  ["belief20_fade", "gru10"], ["gru20_belief_fade", "gru10"],
  ["gru30", "gru20"], ["belief20_weak", "belief20"],
  ["belief20_fade", "belief20_weak"], ["gru20_belief_fade", "gru20"],
]

[[study.arms]]
name = "gru10"
encoder = "gru"
history_minutes = 10

[[study.arms]]
name = "gru20"
encoder = "gru"
history_minutes = 20

[[study.arms]]
name = "gru30"
encoder = "gru"
history_minutes = 30

[[study.arms]]
name = "belief20"
encoder = "belief"
history_minutes = 20

[[study.arms]]
name = "belief20_weak"
encoder = "belief"
history_minutes = 20
belief_prior_shape = 0.1
belief_prior_rate = 0.1

[[study.arms]]
name = "belief20_fade"
encoder = "belief"
history_minutes = 20
belief_prior_shape = 0.1
belief_prior_rate = 0.1
belief_decay = 0.8

[[study.arms]]
name = "gru20_belief_fade"
encoder = "belief_gru"
history_minutes = 20
belief_prior_shape = 0.1
belief_prior_rate = 0.1
belief_decay = 0.8
