<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Làng Đại học 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-bleed 3D campus map with floating control-room cards (KPIs top-left, detail right, trip + lists bottom). */
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --panel-2: #f4f6fa;
  --line: #e2e6ee;
  --fg: #141a2a;
  --muted: #6a7387;
  --accent: #2457f5;
  --accent-soft: #e8eeff;
  --ok: #12895a; --ok-soft: #e2f5eb;
  --warn: #b86e00; --warn-soft: #fff1d9;
  --bad: #cf2f47; --bad-soft: #fde7ea;
  --r1: #2f6bff; --r2: #ef8a1f; --r3: #13a06a;
  --reserve: #9aa3b5;
  --pax: #5d6b8a;
  --shadow: 0 6px 20px rgba(28, 40, 74, .08), 0 1px 2px rgba(28, 40, 74, .06);
  /* scene */
  --s-sky: #eef1f6; --s-ground: #e8ecf2; --s-grass: #dbe9d6; --s-road: #d0d6e0; --s-mark: #ffffff;
  --s-curb: #f2c230; --s-building: #f6f7fa; --s-roof: #dfe4ee; --s-water: #9cc6ee; --s-tree: #7cb37b;
  --s-field: #c7e2bf; --s-concrete: #c9ced8;
  --font-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131c; --panel: #161d2a; --panel-2: #1c2433; --line: #283246; --fg: #e7ebf3; --muted: #8e98ac;
    --accent: #7090ff; --accent-soft: #1f2a4c;
    --ok: #3fcf8f; --ok-soft: #12322a; --warn: #f3ab3c; --warn-soft: #382910; --bad: #ff6d80; --bad-soft: #3c1822;
    --r1: #5b8bff; --r2: #f59a3a; --r3: #2fc287; --reserve: #6c7589; --pax: #9aa8c6;
    --shadow: 0 8px 24px rgba(0, 0, 0, .35), 0 1px 2px rgba(0, 0, 0, .3);
    --s-sky: #0e131c; --s-ground: #171e2b; --s-grass: #1b2d24; --s-road: #2a3343; --s-mark: #59657c;
    --s-curb: #8c7430; --s-building: #2a3243; --s-roof: #333d52; --s-water: #1d4266; --s-tree: #2e5a3c;
    --s-field: #22402c; --s-concrete: #3a4356;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131c; --panel: #161d2a; --panel-2: #1c2433; --line: #283246; --fg: #e7ebf3; --muted: #8e98ac;
  --accent: #7090ff; --accent-soft: #1f2a4c;
  --ok: #3fcf8f; --ok-soft: #12322a; --warn: #f3ab3c; --warn-soft: #382910; --bad: #ff6d80; --bad-soft: #3c1822;
  --r1: #5b8bff; --r2: #f59a3a; --r3: #2fc287; --reserve: #6c7589; --pax: #9aa8c6;
  --shadow: 0 8px 24px rgba(0, 0, 0, .35), 0 1px 2px rgba(0, 0, 0, .3);
  --s-sky: #0e131c; --s-ground: #171e2b; --s-grass: #1b2d24; --s-road: #2a3343; --s-mark: #59657c;
  --s-curb: #8c7430; --s-building: #2a3243; --s-roof: #333d52; --s-water: #1d4266; --s-tree: #2e5a3c;
  --s-field: #22402c; --s-concrete: #3a4356;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 12px; }

.app { height: 100%; display: flex; flex-direction: column; }

/* Top bar */
.topbar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 10;
}
.back { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
.back:hover { background: var(--panel-2); }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
.search { position: relative; flex: 1 1 260px; max-width: 380px; min-width: 0; }
.search input {
  width: 100%; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
  padding: 0 34px 0 34px; font: inherit; color: var(--fg);
}
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 11px; top: 10px; color: var(--muted); }
.search kbd { position: absolute; right: 8px; top: 8px; font: 11px var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; background: var(--panel); }
.results { position: absolute; top: 42px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 20; max-height: 300px; overflow: auto; }
.results button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.results button:hover, .results button.on { background: var(--accent-soft); }
.results small { color: var(--muted); margin-left: auto; }
.depot { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 5px 10px 5px 6px; background: var(--panel); cursor: pointer; text-align: left; }
.depot:hover { border-color: var(--accent); }
.tagbox { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 5px 7px; border-radius: 7px; }
.depot b { display: block; font-size: 13px; }
.depot small { color: var(--muted); font-size: 11px; }
.toplinks { display: flex; gap: 4px; margin-left: auto; align-items: center; }
.link { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.link:hover, .link[aria-pressed="true"] { background: var(--accent-soft); }
.live { display: inline-flex; align-items: center; gap: 7px; background: var(--ok-soft); color: var(--ok); font-weight: 600; font-size: 12.5px; padding: 6px 11px; border-radius: 999px; white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 currentColor; animation: pulse 1.8s infinite; }
.live.paused { background: var(--warn-soft); color: var(--warn); }
.live.paused i { animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 60%, transparent); } 100% { box-shadow: 0 0 0 7px transparent; } }
.speed { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 2px; background: var(--panel-2); }
.speed button { border: 0; background: transparent; padding: 4px 9px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
.speed button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: var(--shadow); }
.who { display: flex; align-items: center; gap: 8px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.who b { display: block; font-size: 13px; }
.who small { color: var(--muted); font-size: 11px; }

/* Stage */
.stage { position: relative; flex: 1; min-height: 0; }
.viewport { position: absolute; inset: 0; }
.viewport canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.viewport canvas:active { cursor: grabbing; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }

.kpis { position: absolute; top: 14px; left: var(--gutter-l); display: flex; gap: 10px; z-index: 3; }
.kpi { display: flex; gap: 12px; align-items: center; padding: 12px 16px 12px 12px; min-width: 150px; }
.kpi .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.kpi small { display: block; color: var(--muted); font-size: 11.5px; }
.kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.kpi .v em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--muted); }
.delta { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 3px; }
.delta.up { background: var(--bad-soft); color: var(--bad); }
.delta.down { background: var(--ok-soft); color: var(--ok); }

.mapctl { position: absolute; top: 14px; right: calc(var(--gutter-r) + 320px + 12px); display: flex; flex-direction: column; padding: 4px; gap: 2px; z-index: 3; }
.mapctl button { width: 34px; height: 34px; border: 0; background: transparent; border-radius: 9px; cursor: pointer; display: grid; place-items: center; color: var(--fg); }
.mapctl button:hover { background: var(--panel-2); }
.mapctl hr { border: 0; border-top: 1px solid var(--line); margin: 3px 4px; }

.side { position: absolute; top: 14px; right: var(--gutter-r); width: 320px; max-height: calc(100% - 14px - 262px - 12px); overflow: auto; padding: 14px; z-index: 3; display: flex; flex-direction: column; gap: 12px; }
.side-head { display: flex; gap: 10px; align-items: flex-start; }
.side-head .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.side-head h2 { margin: 2px 0 0; font-size: 16px; line-height: 1.25; text-wrap: balance; }
.side-head .x { margin-left: auto; border: 1px solid var(--line); background: var(--panel); width: 28px; height: 28px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; flex: none; }
.statusrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--panel-2); border-radius: 10px; padding: 9px 10px; min-width: 0; }
.tile small { display: block; color: var(--muted); font-size: 11px; }
.tile b { font-size: 17px; letter-spacing: -.01em; }
.tile b em { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 500; }
.bar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.bar.ok i { background: var(--ok); } .bar.warn i { background: var(--warn); } .bar.bad i { background: var(--bad); }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 13px; }
.sec-title small { font-weight: 500; color: var(--muted); font-size: 11px; }
.rows { display: flex; flex-direction: column; gap: 2px; }
.row { display: flex; gap: 10px; align-items: center; padding: 7px 6px; border-radius: 9px; border: 0; background: transparent; width: 100%; text-align: left; cursor: pointer; min-width: 0; }
.row:hover { background: var(--panel-2); }
.row .grow { flex: 1; min-width: 0; }
.row .name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; font-size: 13px; }
.row .sub { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chip { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; color: #fff; border-radius: 6px; padding: 2px 6px; flex: none; }
.pill { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 7px; white-space: nowrap; flex: none; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.mute { background: var(--panel-2); color: var(--muted); }
.hw { display: inline-flex; gap: 2px; }
.hw span { font-size: 10.5px; padding: 1px 5px; border-radius: 5px; color: var(--muted); background: var(--panel-2); }
.hw span.on { background: var(--fg); color: var(--panel); font-weight: 700; }
.cost-legend { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; font-size: 11.5px; }
.cost-legend .sw { width: 9px; height: 9px; border-radius: 3px; }
.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); }
.foot { font-size: 11px; color: var(--muted); line-height: 1.45; border-top: 1px solid var(--line); padding-top: 10px; }

.trip { position: absolute; left: var(--gutter-l); bottom: 14px; right: calc(var(--gutter-r) + 320px + 12px); max-width: 620px; padding: 14px 16px; z-index: 3; display: flex; gap: 16px; align-items: stretch; }
.trip-main { flex: 1; min-width: 0; }
.trip-head { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.trip-head b { font-size: 14px; }
.trip-head small { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); position: relative; }
.step { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5px; position: relative; min-width: 0; }
.step::before { content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 3px; background: var(--line); z-index: 0; }
.step:first-child::before { display: none; }
.step.done::before, .step.cur::before { background: var(--accent); }
.step .node { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; z-index: 1; color: var(--muted); }
.step.done .node { background: var(--accent); border-color: var(--accent); color: #fff; }
.step.cur .node { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.step b { font-size: 11.5px; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.step small { font-size: 10.5px; color: var(--muted); }
.trip-card { width: 190px; flex: none; background: var(--panel-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.trip-card .id { font-weight: 700; font-size: 16px; }
.trip-card small { color: var(--muted); font-size: 11.5px; }

.lists { position: absolute; right: var(--gutter-r); bottom: 14px; width: 320px; height: 262px; z-index: 3; display: flex; flex-direction: column; padding: 10px; }
.tabs { display: flex; gap: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.tabs button { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12.5px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.tabpanel { overflow: auto; flex: 1; min-height: 0; }
.qbar { width: 46px; flex: none; }
.log-code { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; }

/* World labels */
.lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap; will-change: transform; }
.lbl-bld { font-size: 11px; font-weight: 600; color: var(--fg); background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); padding: 3px 8px; border-radius: 7px; box-shadow: var(--shadow); }
.lbl-bld.big { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: transparent; border: 0; box-shadow: none; font-weight: 700; }
.lbl-stop { pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 7px 2px 3px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--fg); }
.lbl-stop i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 9px; }
.lbl-stop span.n { font-variant-numeric: tabular-nums; }
.lbl-stop .nm { display: none; font-weight: 600; }
.lbl-stop:hover .nm, .lbl-stop.sel .nm { display: inline; }
.lbl-stop.warn { border-color: var(--warn); } .lbl-stop.bad { border-color: var(--bad); background: var(--bad-soft); }
.lbl-stop.sel { outline: 2px solid var(--accent); }
.lbl-bus { font-size: 10px; font-weight: 700; color: #fff; padding: 2px 6px; border-radius: 6px; display: flex; gap: 5px; align-items: center; box-shadow: var(--shadow); }
.lbl-bus u { display: block; width: 18px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .35); overflow: hidden; text-decoration: none; }
.lbl-bus u b { display: block; height: 100%; background: #fff; }
.lbl-bus.sel { outline: 2px solid var(--fg); }

.legend-note { position: absolute; left: var(--gutter-l); top: 96px; font-size: 11px; color: var(--muted); z-index: 2; background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 4px 8px; border-radius: 7px; }

@media (max-width: 1180px) {
  .who { display: none; }
  .kpi { min-width: 0; padding-right: 12px; }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .toplinks { margin-left: 0; width: 100%; justify-content: space-between; flex-wrap: wrap; }
  .search { max-width: none; order: 3; flex-basis: 100%; }
  .stage { display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; }
  .viewport { position: relative; inset: auto; height: 62vh; min-height: 360px; }
  .kpis, .side, .trip, .lists, .mapctl, .legend-note { position: static; width: auto; max-height: none; max-width: none; margin-left: var(--gutter-l); margin-right: var(--gutter-r); }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; order: -1; margin-top: 12px; }
  .kpi { flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px; }
  .kpi .ic { width: 28px; height: 28px; border-radius: 8px; }
  .kpi .ic svg { width: 16px; height: 16px; }
  .kpi .v { font-size: 18px; }
  .mapctl { flex-direction: row; align-self: flex-start; }
  .mapctl hr { border-top: 0; border-left: 1px solid var(--line); margin: 4px 3px; }
  .trip { flex-direction: column; }
  .trip-card { width: auto; }
  .lists { height: 300px; }
  .legend-note { align-self: flex-start; }
}
@media (max-width: 480px) {
  .depot small, .brand { font-size: 15px; }
  .speed button { padding: 4px 7px; }
  .step b { font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .live i { animation: none; }
}
</style>

<div class="app">
  <header class="topbar">
    <button class="back" id="btn-home" aria-label="Về góc nhìn toàn cảnh">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="brand">Làng Đại học 3D</div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Tìm trạm, xe buýt, tuyến, trường…" aria-label="Tìm trạm, xe buýt, tuyến hoặc trường">
      <kbd>/</kbd>
      <div class="results" id="results" hidden></div>
    </div>
    <button class="depot" id="btn-depot" aria-label="Xem bãi đỗ Bến xe buýt ĐHQG">
      <span class="tagbox">DEPOT</span>
      <span><b>Bến xe buýt ĐHQG</b><small id="depot-sub">3/5 bãi đang dùng</small></span>
    </button>
    <div class="toplinks">
      <button class="link" id="btn-buses">Lượt xe</button>
      <button class="link" id="btn-routes" aria-pressed="true">Sơ đồ tuyến</button>
      <span class="live" id="live"><i></i><span id="clock">Mô phỏng 06:00</span></span>
      <div class="speed" role="group" aria-label="Tốc độ mô phỏng">
        <button data-speed="0" aria-pressed="false" aria-label="Tạm dừng">❚❚</button>

/* ---------- campus layout (stylised, not to scale) ---------- */
const ROADS = [

const ROUTE_DEFS = [

  const reserves = BUSES.filter((b) => b.mode === 'reserve' && b.cooldown <= SIM.t);
  const order = [0, 1, 2].sort((a, b) => pressure[b] - pressure[a]);
  const top = order[0];
  if (reserves.length && qs[top] > 38 && SIM.t < DEMAND_END_S && ROUTES[top].dispUntil <= SIM.t) {
    const b = reserves[0];
    startDeadhead(b, 'route', top);
    b.cooldown = SIM.t + BUS_COOLDOWN_S;
    ROUTES[top].dispUntil = SIM.t + ROUTE_COOLDOWN_S;
    SIM.M++; acted = true;
    logDecision(`DISPATCH(${b.i},${top})`, `Đưa ${b.id} từ bãi vào ${ROUTES[top].code}: ${qs[top]} khách đang chờ`, 'info');
  }
  ROUTES.forEach((r, i) => {
    const want = (qs[i] > 40 ? 6 : qs[i] > 18 ? 10 : 15) * 60;
    if (!acted && want !== r.headway && r.hwUntil <= SIM.t) {
      r.headway = want; r.hwUntil = SIM.t + ROUTE_COOLDOWN_S; acted = true;
      logDecision(`SET_HEADWAY(${i},${want / 60})`, `${r.code} xuất bến mỗi ${want / 60} phút (hàng chờ ${qs[i]})`, want < 900 ? 'warn' : 'ok');
    }
  });
  if (!acted && SIM.t > DEMAND_END_S + 600) {
    for (const r of ROUTES) {
      const i = r.i;
      const cand = BUSES.find((b) => b.route === i && !b.recall && b.mode !== 'dead' && b.pax.length < 4 && b.cooldown <= SIM.t);
      if (cand && committed(i) > F_MIN && qs[i] < 6 && freeBay() !== undefined) {
        cand.recall = true; cand.bay = freeBay(); cand.cooldown = SIM.t + BUS_COOLDOWN_S; acted = true;
        logDecision(`RECALL(${cand.i})`, `Gọi ${cand.id} về bãi sau chuyến này, ${r.code} chỉ còn ${qs[i]} khách chờ`, 'mute');
        break;
      }
    }
  }
  if (!acted) SIM.noop++;
}

function closeInterval() {
  const c = {
    W: SIM.W, V: 0.25 * SIM.Vp, O: 0.5 * SIM.O, C: 0.5 * SIM.C, CD: 0.5 * SIM.CD, X: SIM.X, U: 5 * SIM.U, E: 60 * SIM.E, M: 2 * SIM.M,
  };
  c.total = Object.values(c).reduce((a, b) => a + b, 0);
  SIM.lastK = c; SIM.kIndex++; SIM.total += c.total;
  SIM.W = SIM.Vp = SIM.O = SIM.C = SIM.CD = SIM.X = SIM.U = SIM.E = SIM.M = 0;
}

function step(dt) {
  spawnPassengers(dt);
  BUSES.forEach((b) => stepBus(b, dt));
  // integrate the per-interval cost terms (passenger- and bus-minutes)
  let waiting = 0, excessive = 0;
  for (const s of ALL_STOPS) {
    waiting += s.queue.length;
    for (const p of s.queue) if (SIM.t - p.t0 > EXCESSIVE_WAIT_S) excessive++;
  }
  let onboard = 0, over = 0, active = 0, dead = 0;
  for (const b of BUSES) {
    onboard += b.pax.length; over += Math.max(0, b.pax.length - COMFORT);
    if (b.mode === 'dead') dead++; else if (b.mode !== 'reserve') active++;
  }
  const m = dt / 60;
  SIM.W += waiting * m; SIM.Vp += onboard * m; SIM.O += over * m; SIM.C += active * m; SIM.CD += dead * m; SIM.X += excessive * m;
  SIM.t += dt;
  if (SIM.t >= SIM.nextAbandon) {
    SIM.nextAbandon += 30;
    for (const s of ALL_STOPS) {
      const before = s.queue.length;
      s.queue = s.queue.filter((p) => SIM.t - p.t0 <= ABANDON_S);
      const gone = before - s.queue.length; SIM.E += gone; SIM.abandonedTotal += gone;
    }
  }
  if (SIM.t >= SIM.nextControl) {
    SIM.nextControl += CONTROL_S;
    closeInterval();
    controller();
    SIM.history.push({ t: SIM.t, waiting });
    if (SIM.history.length > 200) SIM.history.shift();
  }
  if (SIM.t >= HORIZON_S) {
    const nh = waiting + onboard;
    const total = Math.round(SIM.total + 60 * nh);
    const seed = SIM.seed + 1;
    const prevLog = SIM.log;
    resetSim(seed);
    SIM.log = prevLog;
    logDecision('END', `Kết thúc ca: tổng cost ${total.toLocaleString('vi-VN')}, ${nh} khách tồn. Bắt đầu ca mới`, 'mute');
  }
}

// route ribbons
function ribbon(path, width, material, y) {
  const P = path.pts, pos = [], idx = [];
  for (let i = 0; i < P.length; i++) {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)];
    const dx = b.x - a.x, dz = b.z - a.z, L = Math.hypot(dx, dz) || 1;
    const nx = -dz / L * width / 2, nz = dx / L * width / 2;
    pos.push(P[i].x - nx, y, P[i].z - nz, P[i].x + nx, y, P[i].z + nz);
    if (i < P.length - 1) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, material); m.receiveShadow = true; scene.add(m); return m;
}

function select(sel, focus) {
  selection = sel;
  if (sel.kind === 'bus') tracked = sel.ref;
  if (sel.kind === 'stop') {
    const near = nextBusFor(sel.ref);
    if (near) tracked = near.bus;
  }
  if (focus) {
    let p;
    if (sel.kind === 'bus') { const q = busPose(sel.ref); p = new THREE.Vector3(q.x, 0, q.z); }
    else if (sel.kind === 'stop') p = new THREE.Vector3(sel.ref.center.x, 0, sel.ref.center.z);
    else if (sel.kind === 'depot') p = new THREE.Vector3(-30, 0, 42);
    else if (sel.kind === 'route') { const r = sel.ref; const xs = r.raw.map((q) => q.x), zs = r.raw.map((q) => q.z); p = new THREE.Vector3((Math.min(...xs) + Math.max(...xs)) / 2, 0, (Math.min(...zs) + Math.max(...zs)) / 2); }
    if (p) flyTo(p, sel.kind === 'route' ? 190 : 95);
  }

function flyTo(target, dist) {
  const dir = camera.position.clone().sub(controls.target).normalize();
  const pos = target.clone().add(dir.multiplyScalar(dist));
  if (REDUCED) { controls.target.copy(target); camera.position.copy(pos); controls.update(); return; }
  camAnim = { t0: performance.now(), dur: 650, fromP: camera.position.clone(), fromT: controls.target.clone(), toP: pos, toT: target };
}
function home() {

  else camAnim = { t0: performance.now(), dur: 700, fromP: camera.position.clone(), fromT: controls.target.clone(), toP: HOME.pos.clone(), toT: HOME.target.clone() };

}

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(PICKABLE, true)[0];
  if (hit && hit.object.userData.kind) select({ kind: hit.object.userData.kind, ref: hit.object.userData.ref }, false);
});

const clock = (t) => {
  const m = Math.floor(t / 60) + START_HOUR * 60;
  return `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
};
const busDir = (b) => (b.s <= ROUTES[b.route].fwdLen + 0.5 ? 1 : -1);
function statusOf(b) {
  if (b.mode === 'reserve') return ['Dự phòng', 'mute'];
  if (b.mode === 'dead') return b.deadTo === 'route' ? ['Chạy rỗng vào tuyến', 'info'] : ['Về bãi', 'mute'];
  if (b.mode === 'hold') return ['Chờ xuất bến', 'warn'];
  if (b.mode === 'dwell') return ['Đang đón khách', 'ok'];
  if (b.pax.length > COMFORT) return ['Quá đông', 'bad'];
  return ['Đang chạy', 'info'];
}
function stopLevel(n) { return n >= 22 ? ['Quá tải', 'bad'] : n >= 10 ? ['Đông', 'warn'] : ['Ổn', 'ok']; }
function oldestAge(s) { return s.queue.length ? (SIM.t - s.queue[0].t0) / 60 : 0; }
function etaTo(b, sTarget) {
  const r = ROUTES[b.route];
  const d = (sTarget - b.s + r.path.len) % r.path.len;
  const between = r.events.filter((e) => ((e.s - b.s + r.path.len) % r.path.len) < d).length;
  return d / speedNow() + between * 30 + (b.mode === 'dwell' ? Math.max(0, b.until - SIM.t) : 0);
}
function nextBusFor(stop) {

  for (const b of BUSES) {
    if (b.route !== stop.r || b.mode === 'dead' || b.mode === 'reserve') continue;
    for (const s of [stop.sF, stop.sB]) {
      const eta = etaTo(b, s);
      if (!best || eta < best.eta) best = { bus: b, eta };
    }
  }
  return best;
}
function nextStopOf(b) {
  const r = ROUTES[b.route]; const ev = r.events[b.ev];

}
const pct = (v, m) => `${clamp((v / m) * 100, 0, 100).toFixed(0)}%`;
const lvl = (f) => (f > 0.85 ? 'bad' : f > 0.6 ? 'warn' : 'ok');

function renderTrip() {

  const r = ROUTES[b.route], dir = busDir(b);
  const order = dir > 0 ? [0, 1, 2, 3, 4, 5] : [5, 4, 3, 2, 1, 0];
  const cur = nextStopOf(b);
  const curIdx = order.indexOf(cur.k);
  const steps = order.map((k, i) => {
    const s = r.stops[k];
    const state = i < curIdx ? 'done' : i === curIdx ? 'cur' : '';

    return `<div class="step ${state}"><span class="node">${node}</span><b>${esc(s.name)}</b><small>${when}</small></div>`;
  }).join('');
  const [lab, cls] = statusOf(b);
  const dest = dir > 0 ? r.stops[5] : r.stops[0];
  const eta = etaTo(b, dir > 0 ? cur.sF : cur.sB);
  patch(el, `
    <div class="trip-main">
      <div class="trip-head"><span style="color:var(--accent)">${ICON.bus}</span><b>Theo dõi chuyến</b><small>${b.id} · ${r.code} ${esc(r.name)}</small></div>

    </button>`);
}

function renderFigures() {
  const col = { ok: new THREE.Color(css('--pax')), warn: new THREE.Color(css('--warn')), bad: new THREE.Color(css('--bad')) };
  let i = 0;
  ALL_STOPS.forEach((s) => {
    const n = Math.min(MAX_FIG, s.queue.length);
    const t = s.t, nn = s.n;
    for (let j = 0; j < MAX_FIG; j++, i++) {
      if (j < n) {
        const row = Math.floor(j / 6), c = j % 6;
        const along = (c - 2.5) * 1.05 + (row % 2) * 0.4;
        const out = 1.7 + row * 1.0;
        const x = s.center.x + t.x * along + nn.x * out, z = s.center.z + t.z * along + nn.z * out;
        tmp.position.set(x, 0.75, z); tmp.scale.set(1, 1, 1); tmp.rotation.set(0, 0, 0); tmp.updateMatrix();
        figBody.setMatrixAt(i, tmp.matrix);
        tmp.position.y = 1.65; tmp.updateMatrix(); figHead.setMatrixAt(i, tmp.matrix);
        const age = (SIM.t - s.queue[j].t0) / 60;
        const cc = age > 20 ? col.bad : age > 10 ? col.warn : col.ok;
        figBody.setColorAt(i, cc); figHead.setColorAt(i, cc);
      } else {
        tmp.position.set(0, -50, 0); tmp.scale.set(0.001, 0.001, 0.001); tmp.updateMatrix();
        figBody.setMatrixAt(i, tmp.matrix); figHead.setMatrixAt(i, tmp.matrix);
      }
    }
  });
  figBody.instanceMatrix.needsUpdate = figHead.instanceMatrix.needsUpdate = true;
  if (figBody.instanceColor) figBody.instanceColor.needsUpdate = figHead.instanceColor.needsUpdate = true;
}

let lastSlow = 0;
function renderPanels(force) {
  const now = performance.now();
  if (!force && now - lastSlow < 500) return;
  lastSlow = now;
  renderKPIs(); renderSide(); renderTrip(); renderList(); renderFigures();
  ALL_STOPS.forEach((s) => {
    const n = s.queue.length;
    s.el.querySelector('.n').textContent = n;
    s.el.classList.toggle('warn', n >= 10 && n < 22);
    s.el.classList.toggle('bad', n >= 22);
    s.el.classList.toggle('sel', selection.kind === 'stop' && selection.ref === s);
  });
  BUSES.forEach((b) => {
    b.el.style.background = routeColor(b.route);
    b.fill.style.width = pct(b.pax.length, CAPACITY);
    b.el.classList.toggle('sel', selection.kind === 'bus' && selection.ref === b);
    const m = b.route === null ? MAT.reserve : MAT['r' + (b.route + 1)];
    b.stripe.material = m; b.roof.material = m;
  });
}

/* ---------- UI wiring ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-sel]');
  if (!t) return;
  const [kind, a, b] = t.dataset.sel.split(':');
  if (kind === 'net') home();
  else if (kind === 'route') select({ kind, ref: ROUTES[+a] }, true);
  else if (kind === 'stop') select({ kind, ref: ROUTES[+a].stops[+b] }, true);
  else if (kind === 'bus') select({ kind, ref: BUSES[+a] }, true);
});
document.querySelectorAll('.tabs button').forEach((btn) => btn.addEventListener('click', () => {
  tab = btn.dataset.tab;
  document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', String(x === btn)));
  renderList();
}));
$('#btn-buses').addEventListener('click', () => $('#tab-buses').click());
$('#btn-routes').addEventListener('click', (e) => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(on));
  routeRibbons.forEach((m) => { m.visible = on; });
});
$('#btn-depot').addEventListener('click', () => select({ kind: 'depot' }, true));
$('#btn-home').addEventListener('click', home);
$('#reset').addEventListener('click', home);
const dolly = (f) => {
  const off = camera.position.clone().sub(controls.target);
  const len = clamp(off.length() * f, controls.minDistance, controls.maxDistance);
  camera.position.copy(controls.target).add(off.setLength(len)); controls.update();
};
$('#zoom-in').addEventListener('click', () => dolly(0.8));
$('#zoom-out').addEventListener('click', () => dolly(1.25));
const rotate = (a) => {
  const off = camera.position.clone().sub(controls.target);
  off.applyAxisAngle(new THREE.Vector3(0, 1, 0), a);
  camera.position.copy(controls.target).add(off); controls.update();
};
$('#rot-l').addEventListener('click', () => rotate(Math.PI / 6));
$('#rot-r').addEventListener('click', () => rotate(-Math.PI / 6));

let speed = REDUCED ? 15 : 40;
function setSpeed(v) {
  speed = v;
  document.querySelectorAll('.speed button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.speed === v)));
  $('#live').classList.toggle('paused', v === 0);
}
document.querySelectorAll('.speed button').forEach((b) => b.addEventListener('click', () => setSpeed(+b.dataset.speed)));
setSpeed(speed);

// search
const q = $('#q'), results = $('#results');
const INDEX = [
  ...ROUTES.map((r) => ({ label: `${r.code} · ${r.name}`, sub: 'Tuyến', sel: `route:${r.i}` })),
  ...ALL_STOPS.map((s) => ({ label: s.name, sub: `Trạm · ${ROUTES[s.r].code}`, sel: `stop:${s.r}:${s.k}` })),
  ...BUSES.map((b) => ({ label: b.id, sub: 'Xe buýt', sel: `bus:${b.i}` })),
];
const MARKS = new RegExp('[' + String.fromCharCode(0x300) + '-' + String.fromCharCode(0x36f) + ']', 'g');
const fold = (s) => s.normalize('NFD').replace(MARKS, '').replace(new RegExp(String.fromCharCode(0x111) + '|' + String.fromCharCode(0x110), 'g'), 'd').toLowerCase();
function showResults() {
  const term = fold(q.value.trim());
  if (!term) { results.hidden = true; return; }
  const hits = INDEX.filter((x) => fold(x.label).includes(term)).slice(0, 8);
  results.innerHTML = hits.length
    ? hits.map((h, i) => `<button class="${i === 0 ? 'on' : ''}" data-sel="${h.sel}">${esc(h.label)}<small>${h.sub}</small></button>`).join('')
    : '<div class="muted" style="padding:8px 10px">Không tìm thấy. Thử tên trạm, tên trường hoặc mã xe như XE-04.</div>';
  results.hidden = false;
}
q.addEventListener('input', showResults);
q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { const first = results.querySelector('button'); if (first) { first.click(); q.blur(); } }
  if (e.key === 'Escape') { q.value = ''; results.hidden = true; q.blur(); }
});
results.addEventListener('click', () => { results.hidden = true; q.value = ''; });
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
});
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.search')) results.hidden = true; });

/* ---------- loop ---------- */
function resize() {
  const w = vp.clientWidth, h = vp.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(vp);
resize();

resetSim(20261018);
// warm up so the first frame shows a working morning peak
for (let i = 0; i < 3000; i++) step(1);
tracked = BUSES.find((b) => b.route === 0 && b.mode === 'run') || BUSES[0];

let last = performance.now(), acc = 0, trainX = -110, trainV = 9, trainWait = 0;
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  acc += real * speed;
  let guard = 0;
  while (acc > 0 && guard++ < 400) { const dt = Math.min(1, acc); step(dt); acc -= dt; }
  if (camAnim) {
    const k = clamp((now - camAnim.t0) / camAnim.dur, 0, 1), e = 1 - (1 - k) ** 3;
    camera.position.lerpVectors(camAnim.fromP, camAnim.toP, e);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, e);
    if (k >= 1) camAnim = null;
  }
  controls.update();

  BUSES.forEach((b) => {
    const p = busPose(b);
    b.mesh.position.set(p.x, 0, p.z);
    b.mesh.rotation.y = Math.atan2(p.hx, p.hz);
  });
  if (speed > 0) {
    CARS.forEach((c) => { c.x += c.v * real * 4; if (c.x > 210) c.x = -210; if (c.x < -210) c.x = 210; c.mesh.position.x = c.x; });
    if (trainWait > 0) trainWait -= real;
    else {
      trainX += trainV * real * 3;
      if (trainX > 150) { trainX = 150; trainV = -9; }
      if (trainX < -110) { trainX = -110; trainV = 9; trainWait = 3; }
    }
    train.position.x = trainX;
  }

  const sel = selection.kind === 'bus' ? busPose(selection.ref) : selection.kind === 'stop' ? selection.ref.center : null;
  ring.visible = !!sel;
  if (sel) {
    ring.position.x = sel.x; ring.position.z = sel.z;
    const s = REDUCED ? 1 : 1 + 0.08 * Math.sin(now / 250); ring.scale.set(s, s, s);
  }

  renderer.render(scene, camera);

  const w = vp.clientWidth, h = vp.clientHeight;
  LABELS.forEach((l) => place(l.el, l.pos, w, h));
  ALL_STOPS.forEach((s) => place(s.el, s.lblPos, w, h));
  const bp = new THREE.Vector3();
  BUSES.forEach((b) => { const p = busPose(b); bp.set(p.x, 4.2, p.z); place(b.el, bp, w, h); });

  renderPanels(false);
  requestAnimationFrame(frame);
}
renderPanels(true);
requestAnimationFrame(frame);
})();
</script>
