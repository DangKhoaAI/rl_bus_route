# Station API on Render; Vercel serves the pages and proxies the API here (vercel.json).
# Render builds the Dockerfile from git; STATION_TARGET reaches it as a build arg and
# selects the ppo stage, which downloads the checkpoint from the `core-11` release.
#
# Simulations live in the server's memory, so the service must stay at one instance.
services:
  - type: web
    name: bus-rl-station
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: STATION_TARGET
        value: ppo
      - key: PORT
        value: "8000"
