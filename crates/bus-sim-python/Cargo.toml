[package]
name = "bus-sim-python"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 bindings exposing the native bus-sim kernel to Python"

[lib]
name = "bus_sim_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
bus-sim-core = { path = "../bus-sim-core" }
ndarray = "0.17"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
